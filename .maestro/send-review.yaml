# Maestro E2E: Send → review screen on Ethereum Sepolia. TESTNET ONLY, NO REAL FUNDS.
# Stops at review and taps Cancel: it never holds "Hold to send", so nothing is signed or broadcast.
# The public test wallet is UNFUNDED on Sepolia (balance 0), so the send screen correctly shows
# "Exceeds balance" and keeps Review disabled. In that case the flow asserts exactly that and stops;
# only if someone funds the address does it continue to the review screen.
appId: com.vaultlite.demo
name: Send review (no broadcast)
tags: [send, smoke]
env:
  MNEMONIC: abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about
  PIN: "135790"
  # Second account of the same public test mnemonic (not a real person's address).
  TO: "0x6Fac4D18c912343BF86fa7049364Dd4E424Ab9C0"
  AMOUNT: "0.001"
---
- runFlow: subflows/import-test-wallet.yaml
- tapOn:
    id: "qa-send"
- assertVisible:
    id: "send"
- tapOn: "ETH · Ethereum Sepolia"
- tapOn:
    id: "to"
- inputText: ${TO}
- hideKeyboard   # close the system keyboard opened by the recipient field (it would cover Review)
- tapOn:
    id: "amount"
- inputText: ${AMOUNT}
# No hideKeyboard: the amount field suppresses the soft keyboard (custom keypad), and on Android
# hideKeyboard can fall back to a Back press that leaves the Send screen.
# Wait for the balance to load (caption leaves "loading…") so the Review state is final.
- extendedWaitUntil:
    notVisible: "Available: loading…"
    timeout: 20000
# Unfunded (expected): Review must be disabled and the over-balance error shown.
- runFlow:
    when:
      visible: "Exceeds balance"
    commands:
      # Maestro's enabled:false doesn't reliably match RN accessibilityState; assert behaviour instead:
      # tapping the disabled Review must NOT open the review screen.
      - tapOn:
          id: "send-review"
      - waitForAnimationToEnd:
          timeout: 3000
      - assertNotVisible:
          id: "review-amount"
      - assertVisible:
          id: "send"
# Funded: open the review screen, check it, then Cancel without holding "Hold to send".
- runFlow:
    when:
      notVisible: "Exceeds balance"
    commands:
      - tapOn:
          id: "send-review"
      - extendedWaitUntil:
          visible:
            id: "review-amount"
          timeout: 20000
      - assertVisible:
          id: "send-review"          # normal (non-danger) review for an EOA recipient
      - assertNotVisible:
          id: "danger-block"
      - assertVisible: "Ethereum Sepolia"
      - assertVisible: "Hold to send"
      - tapOn: "Cancel"
      - assertVisible:
          id: "send"
