# Maestro E2E: onboarding via import → PIN → Home → Receive shows the expected address.
# Uses the public BIP-39 test mnemonic ("abandon … about"); TESTNET ONLY, never fund it.
appId: com.vaultlite.demo
name: Onboarding (import)
tags: [onboarding, smoke]
env:
  MNEMONIC: abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about
  PIN: "135790"
  EVM_ADDRESS: "0x9858EfFD232B4033E47d90003D41EC34EcaEda94"
---
- runFlow: subflows/import-test-wallet.yaml
- assertVisible:
    id: "total"
- tapOn:
    id: "qa-receive"
- assertVisible:
    id: "receive-address"
    text: ${EVM_ADDRESS}
- back
- assertVisible:
    id: "home"
