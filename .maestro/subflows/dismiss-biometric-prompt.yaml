# If the Android system biometric prompt is up, cancel it so the app's PIN keypad is reachable.
# The prompt is a system window: while it is shown, app testIDs (lock/home) are not in Maestro's hierarchy.
appId: com.vaultlite.demo
---
- runFlow:
    when:
      visible:
        text: "(?i).*(touch the fingerprint sensor|use fingerprint|verify it.s you|confirm transaction|unlock).*"
    commands:
      - tapOn:
          text: "(?i)cancel"
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
